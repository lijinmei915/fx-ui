name: check

# 推到 main 或开 PR 时，服务器端自动跑全套检查。
# 这是绕不过的兜底——本地 pre-commit 可被 --no-verify 跳过，CI 不行。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: token 生成器无漂移校验（生成后应与提交内容一致）
        run: |
          npm run build:tokens
          if ! git diff --exit-code docs/data/design-tokens.json; then
            echo "❌ design-tokens.json 与 CSS 不同步：请本地跑 npm run build:tokens 后重新提交。"
            exit 1
          fi

      - name: 全套检查
        run: npm run check:all
